# GPW Srinagar — Supabase local config
# Docs: https://supabase.com/docs/guides/cli/config

project_id = "gpw-srinagar"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[auth]
enabled = true
site_url = "https://shafqat-seven.vercel.app"
additional_redirect_urls = [
  "https://shafqat-seven.vercel.app/auth/callback",
  "https://shafqat-seven.vercel.app/login",
  "https://shafqat-seven.vercel.app/signup",
  "https://shafqat-seven.vercel.app/admin/login",
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/login",
  "http://localhost:3000/signup",
  "http://localhost:3000/admin/login",
]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false
